apiVersion: v1
kind: Service
metadata:
  name: orka-gateway-telegram
  labels:
    app.kubernetes.io/name: orka-gateway-telegram
    app.kubernetes.io/component: adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orka-gateway-telegram
    app.kubernetes.io/component: adapter
  ports:
    - name: http
      appProtocol: http
      port: 8080
      protocol: TCP
      targetPort: http
