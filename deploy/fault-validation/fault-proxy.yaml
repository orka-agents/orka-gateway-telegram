apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-fault-proxy
  labels:
    app.kubernetes.io/name: telegram-fault-proxy
    app.kubernetes.io/instance: fault-validation
    app.kubernetes.io/component: fault-proxy
    app.kubernetes.io/part-of: orka-gateway-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-fault-proxy
      app.kubernetes.io/instance: fault-validation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-fault-proxy
        app.kubernetes.io/instance: fault-validation
        app.kubernetes.io/component: fault-proxy
        app.kubernetes.io/part-of: orka-gateway-telegram
    spec:
      serviceAccountName: telegram-fault-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/sozercan/telegram-fault-proxy:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDRESS
              value: :8080
            - name: TELEGRAM_FAULT_PROXY_CONTROL_TOKEN_FILE
              value: /var/run/secrets/telegram-fault-proxy/control-token
            - name: TELEGRAM_FAULT_PROXY_BOT_ID
              value: "900000001"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-token
              mountPath: /var/run/secrets/telegram-fault-proxy
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: control-token
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: telegram-fault-proxy-control
                  items:
                    - key: control-token
                      path: control-token
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-fault-proxy
  labels:
    app.kubernetes.io/name: telegram-fault-proxy
    app.kubernetes.io/instance: fault-validation
    app.kubernetes.io/component: fault-proxy
    app.kubernetes.io/part-of: orka-gateway-telegram
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telegram-fault-proxy
    app.kubernetes.io/instance: fault-validation
  ports:
    - name: http
      appProtocol: http
      port: 8080
      protocol: TCP
      targetPort: http
