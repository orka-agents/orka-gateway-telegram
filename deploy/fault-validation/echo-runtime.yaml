apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-fault-echo-runtime
  labels:
    app.kubernetes.io/name: telegram-fault-echo-runtime
    app.kubernetes.io/instance: fault-validation
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: orka-gateway-telegram
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-fault-echo-runtime
      app.kubernetes.io/instance: fault-validation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-fault-echo-runtime
        app.kubernetes.io/instance: fault-validation
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: orka-gateway-telegram
    spec:
      serviceAccountName: telegram-fault-echo-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: docker.io/sozercan/orka:gateway-echo-c65ebad8@sha256:cae311f5a9cf38b668af368357651551f4666e28140283a2483b51e63e01cbfd
          imagePullPolicy: IfNotPresent
          env:
            - name: ORKA_REMOTE_HTTP_RUNTIME_ADDR
              value: :8080
            - name: ORKA_REMOTE_HTTP_RUNTIME_NAME
              value: telegram-fault-echo-runtime
            - name: ORKA_REMOTE_HTTP_RUNTIME_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-fault-echo-runtime-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-fault-echo-runtime
  labels:
    app.kubernetes.io/name: telegram-fault-echo-runtime
    app.kubernetes.io/instance: fault-validation
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: orka-gateway-telegram
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telegram-fault-echo-runtime
    app.kubernetes.io/instance: fault-validation
  ports:
    - name: http
      appProtocol: http
      port: 8080
      protocol: TCP
      targetPort: http
