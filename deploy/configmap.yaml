apiVersion: v1
kind: ConfigMap
metadata:
  name: orka-gateway-telegram
  labels:
    app.kubernetes.io/name: orka-gateway-telegram
data:
  LISTEN_ADDRESS: ":8080"
  DATABASE_PATH: /data/telegram-adapter.db
  TELEGRAM_API_BASE_URL: https://api.telegram.org
  TELEGRAM_WEBHOOK_URL: ""
  TELEGRAM_DROP_PENDING_UPDATES: "false"
  ORKA_GATEWAY_INGRESS_URL: http://orka-api.orka-system.svc.cluster.local:8080/api/v1/gateways/orka-gateway-telegram/telegram/events
  TELEGRAM_CONFORMANCE_CHAT_ID: "0"
  REQUEST_TIMEOUT: 15s
  SHUTDOWN_TIMEOUT: 20s
