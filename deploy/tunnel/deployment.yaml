apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-quick-tunnel
  labels:
    app.kubernetes.io/name: telegram-quick-tunnel
    app.kubernetes.io/component: live-fixture
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-quick-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-quick-tunnel
        app.kubernetes.io/component: live-fixture
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --url
            - http://orka-gateway-telegram:8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
