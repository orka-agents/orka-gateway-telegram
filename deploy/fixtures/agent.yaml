apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: telegram-echo
  namespace: orka-gateway-telegram
  labels:
    app.kubernetes.io/name: telegram-echo-runtime
    app.kubernetes.io/component: live-fixture
spec:
  runtime:
    runtimeRef:
      name: telegram-echo-runtime
  systemPrompt:
    inline: |
      You are a deterministic live-validation echo agent. Reply concisely with the
      received Telegram text and do not request tools or perform side effects.
