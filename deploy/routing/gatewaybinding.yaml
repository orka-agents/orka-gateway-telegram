apiVersion: gateway.orka.ai/v1alpha1
kind: GatewayBinding
metadata:
  name: telegram-ai
  labels:
    app.kubernetes.io/name: orka-gateway-telegram
spec:
  gatewayRef:
    name: telegram
  agentRef:
    name: telegram-ai
  match:
    accountId: REPLACE_WITH_TELEGRAM_ACCOUNT_ID
    contextId: REPLACE_WITH_TELEGRAM_CHAT_ID
  senderPolicy:
    mode: allowlist
    allowedSenderIds:
      - REPLACE_WITH_TELEGRAM_SENDER_ID
  priority: 200
  session:
    mode: context-sender
  taskDefaults:
    timeout: 10m
    retryPolicy:
      maxRetries: 0
    agentRuntimeMaxTurns: 4
  activeTurnBehavior: queue
